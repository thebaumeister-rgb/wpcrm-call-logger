<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="app-version" content="32">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f6f68">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WPCRM Calls">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>WPCRM Call Logger</title>
    <link rel="manifest" href="manifest.webmanifest?v=32">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css?v=32">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">WPCRM</p>
          <h1>Call Logger</h1>
        </div>
        <button class="icon-button" id="reset-form" type="button" aria-label="Clear form" title="Clear form">
          <span aria-hidden="true">Clear</span>
        </button>
      </header>
      <div class="app-status"><span>Version 32</span><span id="connection-status" role="status"></span><a href="START-HERE.html">Install &amp; help</a></div>
      <div id="storage-warning" role="alert" hidden>Saved calls could not be read. Saving is blocked to protect the original data. <button type="button" id="recover-storage">Download recovery copy</button></div>

      <p id="voice-status" role="status" aria-live="polite">Ready</p>

      <form id="call-form" class="entry-form" autocomplete="off">
        <label class="field-dictation-setting"><input id="dictate-on-tap" type="checkbox"> Offline voice recognition</label>
        <section class="field-block">
          <div class="toolbar"><button type="button" id="import-contacts">Import contacts</button><button type="button" id="clear-contacts">Remove contact list</button></div>
          <input type="file" id="contacts-file" accept=".csv,.txt,.json" hidden>
          <p id="contacts-status" role="status">No contact list imported (optional).</p>
          <datalist id="contact-options"></datalist>
        </section>
        <section class="field-block">
          <label for="contact-name">Name</label>
          <input id="contact-name" name="contactName" type="text" autocomplete="off" list="contact-options" required>
          <p id="contact-match" role="status"></p>
        </section>

        <section class="field-block" id="additional-contacts-field">
          <label for="additional-contacts">Add name (comma-separated or one per line, optional)</label>
          <textarea id="additional-contacts" name="additionalContacts" rows="2"></textarea>
        </section>

        <section class="field-block">
          <label for="appointment-subject">Subject</label>
          <input id="appointment-subject" name="appointmentSubject" type="text" required>
        </section>

        <section class="field-block">
          <label for="appointment-datetime">Time - Start</label>
          <input id="appointment-datetime" name="appointmentDatetime" type="datetime-local" required>
          <label for="appointment-end-datetime">Time - End</label>
          <input id="appointment-end-datetime" name="appointmentEndDatetime" type="datetime-local" required>
        </section>
        <section class="field-block">
          <label for="appointment-status">Status</label>
          <select id="appointment-status" name="appointmentStatus" required><option value=""></option><option value="Open">Open</option><option value="Completed">Completed</option></select>
        </section>
        <section class="field-block">
          <span class="label">Purpose</span>
          <div class="segmented-control" role="radiogroup" aria-label="Appointment type">
            <label>
              <input type="radio" name="appointmentType" value="Decision-Maker Conference Call" required>
              <span>Call</span>
            </label>
            <label>
              <input type="radio" name="appointmentType" value="Decision-Maker Meeting">
              <span>Meeting</span>
            </label>
          </div>
        </section>

        <section class="field-block mileage-field" id="mileage-field">
          <label for="mileage">Mileage</label>
          <input id="mileage" name="mileage" type="number" min="0" step="0.1" inputmode="decimal" required>
        </section>

        <section class="field-block">
          <label for="appointment-notes">Notes</label>
          <textarea id="appointment-notes" name="appointmentNotes" rows="6" required></textarea>
        </section>
        <section class="field-block">
          <label for="actions">Actions / to-do items (optional)</label>
          <textarea id="actions" name="actions" rows="2"></textarea>
        </section>
        <button class="primary-button" id="save-call" type="submit">Save</button>
      </form>

      <section class="toolbar" aria-label="Saved call tools">
        <button type="button" id="copy-latest">Copy latest</button>
        <button type="button" id="export-csv">Export CSV</button>
        <button type="button" id="export-json">Export JSON</button>
        <button type="button" id="share-json">Share JSON</button>
        <button type="button" id="import-json">Import saved calls</button>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
      </section>
      <p id="share-status" role="status" hidden></p>
      <p id="update-status" role="status" aria-live="polite"></p>
      <footer class="toolbar"><button type="button" id="install-app" hidden>Install app</button><button type="button" id="check-update">Check for updates</button><button type="button" id="reload-app" hidden>Reload update</button></footer>

      <section class="history-section">
        <div class="section-heading">
          <h2>Saved calls</h2>
          <span id="entry-count">0</span>
        </div>
        <div id="empty-state" class="empty-state">No calls saved yet.</div>
        <ol id="call-list" class="call-list"></ol>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <aside id="field-microphone" class="field-microphone" hidden aria-label="Field microphone">
      <span id="field-microphone-status" role="status" aria-live="polite"></span>
      <button type="button" id="stop-field-microphone">Stop</button>
    </aside>

    <script src="papaparse.min.js" defer></script>
    <script src="native-offline.js?v=32" defer></script>
    <script src="app.js?v=32" defer></script>
    <script src="entry-tools.js?v=32" defer></script>
    <script src="field-dictation.js?v=32" defer></script>
  </body>
</html>
